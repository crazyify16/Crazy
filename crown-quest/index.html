<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crown Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: one-screen phone app. Map (scrolling level path) / Game (goals bar, board, boosters) / Castle (scene + tasks). Single dark royal look. */
:root {
  color-scheme: dark;
  --night: #141932;
  --night-2: #222a55;
  --stone: #39407a;
  --gold: #ffc53d;
  --gold-deep: #b9720b;
  --cream: #fff4d9;
  --ruby: #e8343f;
  --leaf: #3cb84a;
  --sky: #2d7fe6;
  --ink: #1b1532;
  --muted: #aab1e0;
  --display: 'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
  --body: 'Nunito', 'Segoe UI', system-ui, sans-serif;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: radial-gradient(120% 70% at 50% 0%, var(--night-2), var(--night) 70%);
  background-color: var(--night);
  color: var(--cream);
  font-family: var(--body);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
#app { height: 100%; max-width: 560px; margin: 0 auto; position: relative; }
.screen { height: 100%; display: flex; flex-direction: column; padding: 10px 16px; box-sizing: border-box; gap: 10px; }

/* shared chunky button */
.btn {
  font-family: var(--display); font-size: 20px; letter-spacing: .02em;
  padding: 10px 18px; border-radius: 14px;
  background: linear-gradient(#ffd96a, var(--gold) 55%, #f0a01c);
  color: var(--ink);
  box-shadow: 0 4px 0 var(--gold-deep), 0 8px 18px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.6);
  text-shadow: 0 1px 0 rgba(255,255,255,.5);
  transition: transform .08s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-deep), inset 0 2px 0 rgba(255,255,255,.6); }
.btn.green { background: linear-gradient(#8ff07c, var(--leaf) 60%, #23902f); box-shadow: 0 4px 0 #17621f, 0 8px 18px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.5); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
.btn.blue { background: linear-gradient(#7fb8ff, var(--sky) 60%, #1b55b0); box-shadow: 0 4px 0 #123f85, 0 8px 18px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.45); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
.btn.ghost { background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 2px rgba(255,255,255,.18); color: var(--cream); text-shadow: none; }
.btn[disabled] { filter: grayscale(.8) brightness(.7); cursor: not-allowed; }

/* ---------- map ---------- */
.hud { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.brand { font-family: var(--display); font-size: 24px; white-space: nowrap; color: var(--gold); text-shadow: 0 3px 0 var(--gold-deep), 0 6px 14px rgba(0,0,0,.4); letter-spacing: .02em; }
.pill {
  display: flex; align-items: center; gap: 6px; min-width: 70px; justify-content: center;
  font-family: var(--display); font-size: 18px; padding: 5px 12px; border-radius: 999px;
  background: rgba(0,0,0,.35); box-shadow: inset 0 0 0 2px rgba(255,255,255,.12);
  font-variant-numeric: tabular-nums;
}
.pill .ico { width: 20px; height: 20px; display: inline-block; }
#mapScroll { flex: 1; overflow-y: auto; overflow-x: hidden; border-radius: 22px; position: relative;
  background:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,.05) 0 2px, transparent 3px) 0 0/48px 48px,
    linear-gradient(#2a6c3f, #1f5332);
  box-shadow: inset 0 0 0 4px rgba(0,0,0,.25), inset 0 0 40px rgba(0,0,0,.45);
  scrollbar-width: none; }
#mapScroll::-webkit-scrollbar { display: none; }
#mapInner { position: relative; }
#mapPath { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.node {
  position: absolute; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
  font-family: var(--display); font-size: 22px; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.35);
  background: radial-gradient(circle at 35% 30%, #7fb8ff, #1f5fc0 70%);
  box-shadow: 0 5px 0 #123f85, 0 8px 14px rgba(0,0,0,.4), inset 0 0 0 3px rgba(255,255,255,.35);
}
.node.done { background: radial-gradient(circle at 35% 30%, #ffe48a, #e79a12 70%); box-shadow: 0 5px 0 #8a5200, 0 8px 14px rgba(0,0,0,.4), inset 0 0 0 3px rgba(255,255,255,.4); color: var(--ink); text-shadow: 0 1px 0 rgba(255,255,255,.5); }
.node.locked { background: radial-gradient(circle at 35% 30%, #8a8fa8, #4b4f66 70%); box-shadow: 0 5px 0 #2c2f40, inset 0 0 0 3px rgba(255,255,255,.15); color: rgba(255,255,255,.55); cursor: default; }
.node.current { animation: bob 1.2s ease-in-out infinite; z-index: 2; }
.node.current::after { content: ''; position: absolute; inset: -9px; border-radius: 50%; border: 3px solid var(--gold); opacity: .8; }
.node .stars { position: absolute; left: 50%; top: -16px; transform: translateX(-50%); display: flex; gap: 1px; }
.node .stars i { width: 15px; height: 15px; display: block; clip-path: polygon(50% 0, 62% 35%, 100% 38%, 70% 60%, 80% 98%, 50% 76%, 20% 98%, 30% 60%, 0 38%, 38% 35%); background: rgba(0,0,0,.35); }
.node .stars i.on { background: var(--gold); }
@keyframes bob { 50% { transform: translateY(-6px); } }
.mapbar { display: flex; gap: 10px; align-items: stretch; }
.mapbar .btn { flex: 1; font-size: 18px; padding: 10px 8px; }
.mapbar #playBtn { flex: 1.6; font-size: 24px; }

/* ---------- game ---------- */
#game { gap: 8px; }
.gtop { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: stretch; }
.panel { background: linear-gradient(#3f478c, #2a3068); border-radius: 16px; box-shadow: inset 0 0 0 3px rgba(255,255,255,.12), 0 4px 0 #161a3c; }
.back { width: 44px; font-family: var(--display); font-size: 26px; }
.goals { display: flex; justify-content: center; align-items: center; gap: 12px; padding: 6px 10px; min-width: 0; flex-wrap: wrap; }
.goal { position: relative; display: flex; flex-direction: column; align-items: center; }
.goal canvas { width: 38px; height: 38px; display: block; }
.goal b { font-family: var(--display); font-size: 18px; line-height: 1; margin-top: -4px; text-shadow: 0 2px 0 rgba(0,0,0,.5); font-variant-numeric: tabular-nums; }
.goal.bump canvas { animation: bump .25s; }
.goal.met b { color: var(--leaf); }
@keyframes bump { 50% { transform: scale(1.25); } }
.moves { width: 74px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px; }
.moves small { font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.moves b { font-family: var(--display); font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums; }
.moves.low b { color: #ff7a7a; animation: bump .6s infinite; }
.lvl-label { text-align: center; font-family: var(--display); font-size: 16px; color: var(--muted); letter-spacing: .06em; }
#boardWrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
#board { touch-action: none; display: block; }
.boosters { display: flex; justify-content: center; gap: 10px; padding-bottom: 4px; }
.boost { position: relative; width: 58px; height: 58px; border-radius: 16px; display: grid; place-items: center; }
.boost canvas { width: 40px; height: 40px; }
.boost .n { position: absolute; right: -4px; bottom: -4px; min-width: 22px; height: 22px; border-radius: 11px; background: var(--ruby); font-family: var(--display); font-size: 14px; display: grid; place-items: center; box-shadow: 0 2px 0 rgba(0,0,0,.35); }
.boost.on { box-shadow: inset 0 0 0 3px var(--gold), 0 0 18px rgba(255,197,61,.6); }
.boost.empty { opacity: .45; }
.hint-line { text-align: center; font-weight: 800; font-size: 14px; color: var(--gold); min-height: 18px; }

/* ---------- castle ---------- */
.castle-head { display: flex; align-items: center; gap: 10px; }
.castle-head h2 { margin: 0; flex: 1; font-family: var(--display); font-weight: 400; font-size: 26px; color: var(--gold); text-shadow: 0 3px 0 var(--gold-deep); text-wrap: balance; }
#scene { width: 100%; aspect-ratio: 16/10; max-width: 100%; border-radius: 18px; display: block; box-shadow: 0 6px 0 #0d1028, 0 0 0 4px rgba(255,255,255,.1); }
.prog { height: 14px; border-radius: 7px; background: rgba(0,0,0,.4); overflow: hidden; }
.prog i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), #ffe48a); border-radius: 7px; transition: width .4s; }
.tasks { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.task { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,.07); }
.task span { flex: 1; font-weight: 800; min-width: 0; }
.task.done span { color: var(--muted); text-decoration: line-through; }
.task .btn { font-size: 16px; padding: 7px 12px; }
.task .tick { font-family: var(--display); color: var(--leaf); font-size: 20px; }

/* ---------- modal / banner / fx ---------- */
#modal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(8,10,28,.6); padding: 16px; }
#modal .card {
  width: min(360px, 100%); box-sizing: border-box; padding: 22px 20px 20px; border-radius: 24px; text-align: center;
  background: linear-gradient(#4a54a8, #2b3170); box-shadow: inset 0 0 0 4px rgba(255,255,255,.14), 0 8px 0 #141836, 0 20px 50px rgba(0,0,0,.5);
  animation: pop .28s cubic-bezier(.2,1.6,.4,1);
  display: flex; flex-direction: column; gap: 14px; align-items: center;
}
#modal h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 32px; color: var(--gold); text-shadow: 0 3px 0 var(--gold-deep); }
#modal p { margin: 0; font-weight: 800; color: var(--muted); max-width: 30ch; }
#modal .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; width: 100%; }
#modal .row .btn { flex: 1; min-width: 120px; }
.goalrow { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.bigstars { display: flex; gap: 6px; align-items: flex-end; }
.bigstars i { width: 56px; height: 56px; display: block; clip-path: polygon(50% 0, 62% 35%, 100% 38%, 70% 60%, 80% 98%, 50% 76%, 20% 98%, 30% 60%, 0 38%, 38% 35%); background: rgba(0,0,0,.35); }
.bigstars i:nth-child(2) { width: 70px; height: 70px; }
.bigstars i.on { background: linear-gradient(#fff3a6, var(--gold) 50%, #f08c00); animation: pop .4s backwards; }
.bigstars i.on:nth-child(2) { animation-delay: .25s; }
.bigstars i.on:nth-child(3) { animation-delay: .5s; }
@keyframes pop { from { transform: scale(.3); opacity: 0; } }
#banner { position: fixed; left: 0; right: 0; top: 42%; z-index: 15; text-align: center; pointer-events: none;
  font-family: var(--display); font-size: 44px; color: var(--gold);
  text-shadow: 0 4px 0 var(--gold-deep), 0 0 30px rgba(0,0,0,.6); opacity: 0; }
#banner.show { animation: banner 1.1s ease-out forwards; }
@keyframes banner { 0% { opacity: 0; transform: scale(.4); } 20% { opacity: 1; transform: scale(1.1); } 30% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-30px); } }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 12; width: 100%; height: 100%; }
@media (prefers-reduced-motion: reduce) {
  .node.current, .moves.low b { animation: none; }
  #banner.show { animation-duration: 1.6s; }
}
</style>
</head>
<body>

<div id="app">
  <section id="map" class="screen">
    <header class="hud">
      <div class="pill" title="Stars"><canvas class="ico" data-icon="star" width="40" height="40"></canvas><span id="starCount">0</span></div>
      <div class="brand">Crown Quest</div>
      <div class="pill" title="Coins"><canvas class="ico" data-icon="coin" width="40" height="40"></canvas><span id="coinCount">0</span></div>
    </header>
    <div id="mapScroll"><div id="mapInner"><svg id="mapPath" aria-hidden="true"></svg></div></div>
    <footer class="mapbar">
      <button class="btn blue" id="castleBtn">Castle</button>
      <button class="btn green" id="playBtn">Level 1</button>
      <button class="btn ghost" id="muteBtn">Mute</button>
    </footer>
  </section>

  <section id="game" class="screen" hidden>
    <header class="gtop">
      <button class="panel back" id="backBtn" aria-label="Back to map">‹</button>
      <div class="panel goals" id="goals"></div>
      <div class="panel moves" id="movesBox"><small>Moves</small><b id="moves">20</b></div>
    </header>
    <div class="lvl-label" id="lvlLabel">Level 1</div>
    <div id="boardWrap"><canvas id="board"></canvas></div>
    <div class="hint-line" id="hintLine"></div>
    <footer class="boosters" id="boosters"></footer>
  </section>

  <section id="castle" class="screen" hidden>
    <div class="castle-head">
      <button class="panel back" id="castleBack" aria-label="Back to map">‹</button>
      <h2 id="areaName">Throne Room</h2>
      <div class="pill"><canvas class="ico" data-icon="star" width="40" height="40"></canvas><span id="starCount2">0</span></div>
    </div>
    <canvas id="scene" width="640" height="400"></canvas>
    <div class="prog"><i id="areaProg" style="width:0%"></i></div>
    <div class="tasks" id="tasks"></div>
  </section>
</div>
<div id="modal" hidden><div class="card"></div></div>
<div id="banner"></div>
<canvas id="fx"></canvas>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const DPR = Math.min(window.devicePixelRatio || 1, 2.5);

/* =========================================================
   Save data
   ========================================================= */
const SAVE_KEY = 'crown-quest-save-v1';
const DEFAULT_SAVE = { unlocked: 1, stars: {}, coins: 120, spent: 0, tasks: [[], [], []], boosters: { hammer: 3, arrow: 2, cannon: 2, shuffle: 2 }, muted: false };
let S = JSON.parse(JSON.stringify(DEFAULT_SAVE));
try { const raw = localStorage.getItem(SAVE_KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) { /* storage unavailable */ }
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* ignore */ } }
const totalStars = () => Object.values(S.stars).reduce((a, b) => a + b, 0);
const starBalance = () => totalStars() - S.spent;

/* =========================================================
   Audio (synthesised, starts after first tap)
   ========================================================= */
let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d, type = 'sine', v = .12, f2 = null, when = 0) {
  const a = ac(); if (!a || S.muted) return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + .03);
}
function noise(d, v = .2, f = 900, f2 = null) {
  const a = ac(); if (!a || S.muted) return;
  const t = a.currentTime, len = Math.floor(a.sampleRate * d), buf = a.createBuffer(1, len, a.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
  const s = a.createBufferSource(); s.buffer = buf;
  const fl = a.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.setValueAtTime(f, t); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + d);
  const g = a.createGain(); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  s.connect(fl).connect(g).connect(a.destination); s.start(t);
}
let lastCrack = 0;
const sfx = {
  swap() { tone(440, .08, 'triangle', .08, 660); },
  bad() { tone(220, .12, 'square', .05, 150); tone(220, .12, 'square', .05, 150, .13); },
  pop(chain) { const f = 520 * Math.pow(1.12, Math.min(chain, 10)); tone(f, .14, 'sine', .14, f * 1.5); tone(f * 2, .08, 'triangle', .04); },
  special() { tone(660, .12, 'triangle', .1, 990); tone(990, .16, 'sine', .08, 1320, .08); },
  rocket() { noise(.35, .12, 3000, 400); },
  boom() { noise(.5, .35, 600, 60); tone(90, .35, 'sine', .25, 40); },
  zap() { tone(1400, .25, 'sawtooth', .04, 300); noise(.2, .06, 6000, 1500); },
  whoosh() { noise(.3, .08, 1800, 600); },
  crack() { const n = performance.now(); if (n - lastCrack < 50) return; lastCrack = n; noise(.12, .15, 1500, 500); },
  win() { [523, 659, 784, 1046].forEach((f, i) => tone(f, .25, 'triangle', .12, null, i * .11)); },
  lose() { [392, 330, 262].forEach((f, i) => tone(f, .3, 'triangle', .1, null, i * .16)); },
  coin() { tone(988, .08, 'square', .05); tone(1318, .2, 'square', .05, null, .07); },
  build() { [392, 523, 659, 784, 1046].forEach((f, i) => tone(f, .18, 'triangle', .1, null, i * .07)); },
};

/* =========================================================
   Tweens & timing
   ========================================================= */
const tweens = [];
const easeOut = t => 1 - (1 - t) * (1 - t);
const easeIn = t => t * t;
const easeIO = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeBack = t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function tween(o, to, dur, ease = easeOut) {
  return new Promise(res => {
    for (const tw of tweens) if (tw.o === o) for (const k in to) delete tw.to[k]; // newest tween wins a property
    const from = {}; for (const k in to) from[k] = o[k];
    tweens.push({ o, from, to, dur: Math.max(1, dur), start: null, ease, res });
  });
}
function stepTweens(now) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i]; if (tw.start === null) tw.start = now;
    const p = Math.min(1, (now - tw.start) / tw.dur), e = tw.ease(p);
    for (const k in tw.to) tw.o[k] = tw.from[k] + (tw.to[k] - tw.from[k]) * e;
    if (p >= 1) { tweens.splice(i, 1); tw.res(); }
  }
}
const delay = ms => new Promise(r => setTimeout(r, ms));
const removeFrom = (arr, x) => { const i = arr.indexOf(x); if (i >= 0) arr.splice(i, 1); };

/* =========================================================
   Seeded random + levels
   ========================================================= */
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const F = '........';
// layout legend: . tile   # hole   C crate   D double crate   S stone (2 hits)
const HAND = [
  { m: 20, k: 4, g: [[0, 12]], L: [F, F, F, F, F, F, F, F, F] },
  { m: 22, k: 4, g: [[1, 15], [2, 15]], L: ['#......#', F, F, F, F, F, F, F, '#......#'] },
  { m: 20, k: 4, g: [], L: [F, F, F, F, 'CCCCCCCC', F, F, F, F] },
  { m: 22, k: 4, g: [[3, 15]], L: [F, F, F, '..CCCC..', '..CCCC..', '..CCCC..', F, F, F] },
  { m: 25, k: 5, g: [[0, 20], [1, 20]], L: ['##....##', '#......#', F, F, F, F, F, '#......#', '##....##'] },
  { m: 25, k: 4, g: [], L: [F, F, 'S......S', 'SS....SS', 'SSS..SSS', F, F, F, F] },
  { m: 26, k: 5, g: [[2, 18]], L: [F, F, 'D......D', 'DD....DD', F, F, 'DD....DD', 'D......D', F] },
  { m: 25, k: 5, g: [[2, 20]], L: [F, F, F, F, F, F, F, 'CCCCCCCC', 'CCCCCCCC'] },
  { m: 28, k: 5, g: [[0, 22], [3, 22], [4, 14]], L: [F, F, '...##...', '..####..', '..####..', '...##...', F, F, F] },
  { m: 30, k: 5, g: [], L: ['SS....SS', 'S......S', F, '..DDDD..', '..DDDD..', F, 'C......C', 'CC....CC', 'CCC..CCC'] },
];
const LEVEL_COUNT = 60;
function genLevel(n) {
  const R = rng(n * 7919 + 13), rows = 9, cols = 8;
  const L = Array.from({ length: rows }, () => Array(cols).fill('.'));
  const hp = Math.floor(R() * 5);
  if (hp === 1) for (const [r, c] of [[0, 0], [0, 7], [8, 0], [8, 7]]) L[r][c] = '#';
  if (hp === 2) for (const [r, c] of [[4, 3], [4, 4]]) L[r][c] = '#';
  if (hp === 3) for (let r = 3; r <= 5; r++) { L[r][0] = '#'; L[r][7] = '#'; }
  const types = n < 16 ? ['C', 'C', 'D'] : n < 26 ? ['C', 'D', 'S'] : ['C', 'D', 'D', 'S', 'S'];
  const want = Math.min(26, 6 + Math.floor(n * .45));
  let placed = 0, tries = 0;
  while (placed < want && tries++ < 500) {
    const r = 2 + Math.floor(R() * 7), c = Math.floor(R() * 4);

    let e = r; while (kindAt(e + 1, c) === k) e++;
    if (e - r >= 2) { const cells = []; for (let y = r; y <= e; y++) cells.push([y, c]); runs.push({ dir: 'v', cells }); }
    r = e + 1;

  for (let r = 0; r < rows - 1; r++) for (let c = 0; c < cols - 1; c++) {
    const k = kindAt(r, c);
    if (k >= 0 && kindAt(r + 1, c) === k && kindAt(r, c + 1) === k && kindAt(r + 1, c + 1) === k) squares.push({ cells: [[r, c], [r, c + 1], [r + 1, c], [r + 1, c + 1]] });
  }
  for (const s of [...runs, ...squares]) { const [r0, c0] = s.cells[0]; add(id(r0, c0)); for (const [r, c] of s.cells) union(id(r0, c0), id(r, c)); }
  const groups = new Map();
  const grp = root => { if (!groups.has(root)) groups.set(root, { cells: new Map(), runs: [], squares: [] }); return groups.get(root); };
  for (const run of runs) { const g = grp(find(id(...run.cells[0]))); g.runs.push(run); run.cells.forEach(([r, c]) => g.cells.set(id(r, c), [r, c])); }

  let best = null, bestScore = -1;
  for (const cell of g.cells.values()) {

function findMove() {
  for (let r = 0; r < G.rows; r++) for (let c = 0; c < G.cols; c++) { const t = G.grid[r][c].tile; if (t && t.sp) return [[r, c]]; }
  for (let r = 0; r < G.rows; r++) for (let c = 0; c < G.cols; c++) for (const [dr, dc] of [[0, 1], [1, 0]]) {

/* ---------- clearing & hits ---------- */
function goalFor(type, c) { return G.goals.find(g => g.type === type && (type !== 'color' || g.c === c) && g.left > 0); }
function clearTile(r, c, to = null) {
  const cell = G.grid[r][c], t = cell.tile; if (!t) return;
  cell.tile = null;
  const goal = goalFor('color', t.k);
  if (goal) { goal.left--; flyToGoal(goal, r, c); }
  G.dying.push(t);
  if (to) tween(t, { x: to[1], y: to[0] }, 130, easeIn).then(() => tween(t, { s: 0, a: 0 }, 60)).then(() => removeFrom(G.dying, t));
  else { burst(r, c, KIND[t.k].c, 6); tween(t, { s: 1.22 }, 70).then(() => tween(t, { s: 0, a: 0 }, 120, easeIn)).then(() => removeFrom(G.dying, t)); }
}
function hitBlocker(r, c) {
  const cell = G.grid[r][c], b = cell.b; if (!b) return;
  b.hp--; sfx.crack();
  burst(r, c, b.t === 'crate' ? '#c88a4e' : '#aab0c2', 7, true);
  if (b.hp <= 0) {
    cell.b = null;
    const goal = goalFor(b.t); if (goal) { goal.left--; flyToGoal(goal, r, c); }
    const d = { b, r, c, s: 1, a: 1 }; G.dyingB.push(d);
    tween(d, { s: 1.3, a: 0 }, 220).then(() => removeFrom(G.dyingB, d));
  } else { b.v.s = 1.2; tween(b.v, { s: 1 }, 180, easeBack); }
}
function track(p) { G.pending.add(p); p.finally(() => G.pending.delete(p)); return p; }
async function flush() { while (G.pending.size) await Promise.all([...G.pending]); }
function hitCell(r, c, ctx) {
  if (!playable(r, c)) return;
  const key = r * G.cols + c;
  if (ctx.seen.has(key)) return; ctx.seen.add(key);
  const cell = G.grid[r][c];
  if (cell.b) { hitBlocker(r, c); return; }
  const t = cell.tile; if (!t) return;
  if (t.sp) { cell.tile = null; track(fire(r, c, t)); return; }
  clearTile(r, c);
}

/* ---------- power-ups ---------- */
async function fire(r, c, t, opt = {}) {
  const type = opt.type || t.sp;
  if (!G.dying.includes(t)) { G.dying.push(t); tween(t, { s: 1.5, a: 0 }, 220).then(() => removeFrom(G.dying, t)); }
  const ctx = { seen: new Set([r * G.cols + c]) };
  switch (type) {
    case 'rh': return rocketLine(r, c, 'h', ctx);
    case 'rv': return rocketLine(r, c, 'v', ctx);
    case 'cross': return Promise.all([rocketLine(r, c, 'h', ctx), rocketLine(r, c, 'v', ctx)]);
    case 'cross3': {
      const ps = [];
      for (let d = -1; d <= 1; d++) { hitCell(r + d, c, ctx); hitCell(r, c + d, ctx); }
      for (let d = -1; d <= 1; d++) { if (r + d >= 0 && r + d < G.rows) ps.push(rocketLine(r + d, c, 'h', ctx)); if (c + d >= 0 && c + d < G.cols) ps.push(rocketLine(r, c + d, 'v', ctx)); }
      return Promise.all(ps);
    }
    case 'tnt': return explode(r, c, opt.radius || 2, ctx);
    case 'prop': return propeller(r, c, ctx, opt.carry);
    case 'prop3': { for (const [dr, dc] of N4) hitCell(r + dr, c + dc, ctx); return Promise.all([0, 1, 2].map(i => delay(i * 90).then(() => propeller(r, c, ctx, null, true)))); }
    case 'ball': return lightBall(r, c, opt.color, ctx);
    case 'all': return clearAll(r, c, ctx);
  }
}
async function rocketLine(r, c, dir, ctx) {
  sfx.rocket();
  const n = dir === 'h' ? G.cols : G.rows, step = 30;
  G.fx.push(rocketFx(r, c, dir));
  const ps = [];
  for (let d = 1; d < n; d++) {
    const cells = dir === 'h' ? [[r, c - d], [r, c + d]] : [[r - d, c], [r + d, c]];
    ps.push(delay(d * step).then(() => cells.forEach(([a, b]) => hitCell(a, b, ctx))));
  }
  await Promise.all(ps);
}
async function explode(r, c, R, ctx) {
  sfx.boom(); G.shake = 6 + R * 2;
  G.fx.push(ringFx(r, c, R));
  const ps = [];
  for (let dr = -R; dr <= R; dr++) for (let dc = -R; dc <= R; dc++) {
    const d = Math.max(Math.abs(dr), Math.abs(dc));
    ps.push(delay(d * 40).then(() => hitCell(r + dr, c + dc, ctx)));
  }
  await Promise.all(ps);
}
function pickTarget(exclude) {
  const prim = [], sec = [];
  for (let r = 0; r < G.rows; r++) for (let c = 0; c < G.cols; c++) {
    const key = r * G.cols + c, cell = G.grid[r][c];
    if (cell.hole || exclude.has(key) || G.claimed.has(key)) continue;
    if (cell.b) (goalFor(cell.b.t) ? prim : sec).push([r, c]);
    else if (cell.tile && !cell.tile.sp) (goalFor('color', cell.tile.k) ? prim : sec).push([r, c]);
  }
  const pool = prim.length ? prim : sec;
  return pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
}
async function propeller(r, c, ctx, carry, skipNeighbors) {
  if (!skipNeighbors) for (const [dr, dc] of N4) hitCell(r + dr, c + dc, ctx);
  const tgt = pickTarget(ctx.seen); if (!tgt) return;
  const key = tgt[0] * G.cols + tgt[1]; G.claimed.add(key);
  sfx.whoosh();
  await flyPropFx(r, c, tgt[0], tgt[1], carry);
  G.claimed.delete(key);
  if (carry) {
    hitCell(tgt[0], tgt[1], { seen: new Set() });
    const ghost = newTile(-1, tgt[0], tgt[1]); ghost.sp = carry;
    await fire(tgt[0], tgt[1], ghost);
  } else hitCell(tgt[0], tgt[1], ctx);
}
function mostCommonColor() {
  const count = Array(5).fill(0);
  for (const row of G.grid) for (const cell of row) if (cell.tile && !cell.tile.sp && !cell.b) count[cell.tile.k]++;
  const wanted = G.goals.filter(g => g.type === 'color' && g.left > 0 && count[g.c] > 0).map(g => g.c);
  if (wanted.length) return wanted.sort((a, b) => count[b] - count[a])[0];
  return count.indexOf(Math.max(...count));
}
async function lightBall(r, c, color, ctx) {
  if (color == null || color < 0) color = mostCommonColor();
  sfx.zap();
  const targets = [];
  for (let y = 0; y < G.rows; y++) for (let x = 0; x < G.cols; x++) if (kindAt(y, x) === color) targets.push([y, x]);
  G.fx.push(boltFx(r, c, targets, KIND[color].c));
  await delay(250);
  await Promise.all(targets.map(([y, x], i) => delay(i * 22).then(() => hitCell(y, x, ctx))));
}
async function ballConvert(r, c, other) {
  const color = mostCommonColor(); sfx.zap();
  const targets = [];
  for (let y = 0; y < G.rows; y++) for (let x = 0; x < G.cols; x++) if (kindAt(y, x) === color) targets.push([y, x]);
  G.fx.push(boltFx(r, c, targets, KIND[color].c));
  for (const [y, x] of targets) {
    const t = G.grid[y][x].tile; t.sp = other === 'rh' || other === 'rv' ? (Math.random() < .5 ? 'rh' : 'rv') : other; t.k = -1; t.s = .3; tween(t, { s: 1 }, 260, easeBack);
  }
  await delay(500);
  targets.sort(() => Math.random() - .5);
  for (const [y, x] of targets) {
    const t = G.grid[y][x].tile;
    if (t && t.sp) { G.grid[y][x].tile = null; track(fire(y, x, t)); await delay(70); }
  }
}
async function clearAll(r, c, ctx) {
  sfx.zap(); sfx.boom(); G.shake = 14;
  const all = [];
  for (let y = 0; y < G.rows; y++) for (let x = 0; x < G.cols; x++) all.push([y, x]);
  G.fx.push(boltFx(r, c, all, '#ffffff'));
  await Promise.all(all.map(([y, x]) => delay(Math.hypot(y - r, x - c) * 45).then(() => hitCell(y, x, ctx))));
}
function consume(t) { if (!G.dying.includes(t)) { G.dying.push(t); tween(t, { s: 0, a: 0 }, 180).then(() => removeFrom(G.dying, t)); } }

/* =========================================================
   Turn flow
   ========================================================= */
function useMove() { G.moves--; updateHud(); }
async function trySwap(r1, c1, r2, c2) {
  if (G.busy || G.over || !playable(r2, c2)) return;
  const A = G.grid[r1][c1], B = G.grid[r2][c2];
  if (!A.tile || !B.tile || A.b || B.b) return;
  G.busy = true; G.sel = null; clearHint();
  const ta = A.tile, tb = B.tile;
  sfx.swap();
  await Promise.all([tween(ta, { x: c2, y: r2 }, 150, easeIO), tween(tb, { x: c1, y: r1 }, 150, easeIO)]);
  A.tile = tb; B.tile = ta;
  G.chain = 0;
  if (!ta.sp && !tb.sp) {
    const groups = findMatches();
    if (!groups.length) {
      sfx.bad();
      await Promise.all([tween(ta, { x: c1, y: r1 }, 150, easeIO), tween(tb, { x: c2, y: r2 }, 150, easeIO)]);
      A.tile = ta; B.tile = tb; G.busy = false; scheduleHint(); return;
    }
    useMove();
    await resolveGroups(groups, [[r2, c2], [r1, c1]]);
  } else {
    useMove();
    await combo(r2, c2, ta, r1, c1, tb);
  }
  await cascade();
  await endTurn();
}
async function combo(rB, cB, ta, rA, cA, tb) {
  const sa = ta.sp, sb = tb.sp, isR = s => s === 'rh' || s === 'rv';
  if (sa && sb) {
    G.grid[rB][cB].tile = null; G.grid[rA][cA].tile = null;
    tween(tb, { x: cB, y: rB }, 120); sfx.special();
    await delay(120);
    const has = s => sa === s || sb === s;
    if (sa === 'ball' && sb === 'ball') { consume(tb); await fire(rB, cB, ta, { type: 'all' }); }
    else if (has('ball')) { consume(ta); consume(tb); await ballConvert(rB, cB, sa === 'ball' ? sb : sa); }
    else if (isR(sa) && isR(sb)) { consume(tb); await fire(rB, cB, ta, { type: 'cross' }); }
    else if (has('tnt') && (isR(sa) || isR(sb))) { consume(tb); await fire(rB, cB, ta, { type: 'cross3' }); }
    else if (sa === 'tnt' && sb === 'tnt') { consume(tb); await fire(rB, cB, ta, { type: 'tnt', radius: 3 }); }
    else if (sa === 'prop' && sb === 'prop') { consume(tb); await fire(rB, cB, ta, { type: 'prop3' }); }
    else { consume(tb); await fire(rB, cB, ta, { type: 'prop', carry: sa === 'prop' ? sb : sa }); }
  } else {
    const sp = sa ? ta : tb, [r, c] = sa ? [rB, cB] : [rA, cA], other = sa ? tb : ta;
    G.grid[r][c].tile = null;
    await fire(r, c, sp, sp.sp === 'ball' ? { color: other.k } : {});
  }
  await flush();
}
async function tapSpecial(r, c) {
  G.busy = true; G.sel = null; clearHint(); useMove(); G.chain = 0;
  const t = G.grid[r][c].tile; G.grid[r][c].tile = null;
  await fire(r, c, t); await flush();
  await cascade(); await endTurn();
}
async function resolveGroups(groups, pref) {
  G.chain++; sfx.pop(G.chain);
  const spawns = [], hits = new Map();
  for (const g of groups) {
    const sp = decideSpecial(g), target = sp ? spawnCell(g, pref) : null;
    if (sp) spawns.push({ r: target[0], c: target[1], sp });
    for (const [r, c] of g.cells.values()) {
      clearTile(r, c, target);
      for (const [dr, dc] of N4) { const y = r + dr, x = c + dc; if (playable(y, x) && G.grid[y][x].b) hits.set(y * G.cols + x, [y, x]); }
    }
  }
  hits.forEach(([y, x]) => hitBlocker(y, x));
  if (G.chain >= 3 && G.chain <= 5) banner(['', '', '', 'Great!', 'Royal!', 'Majestic!'][G.chain]);
  if (spawns.length) {
    await delay(150);
    for (const s of spawns) { const t = newTile(-1, s.r, s.c); t.sp = s.sp; t.s = 0; G.grid[s.r][s.c].tile = t; tween(t, { s: 1 }, 260, easeBack); }
    sfx.special();
  }
  await delay(spawns.length ? 120 : 210);
}
async function cascade() {
  for (let guard = 0; guard < 80; guard++) {
    await flush();
    await settle();
    const groups = findMatches();
    if (!groups.length) { if (G.pending.size) continue; break; }
    await resolveGroups(groups, null);
  }
}

/* ---------- gravity ---------- */
function gravity() {
  const mv = [];
  for (let c = 0; c < G.cols; c++) {
    let seg = [], spawnY = -1;
    for (let r = G.rows - 1; r >= -1; r--) {
      const cell = r >= 0 ? G.grid[r][c] : null;
      if (r === -1 || cell.b) {
        const tiles = [];
        for (const y of seg) { const t = G.grid[y][c].tile; if (t) { tiles.push(t); G.grid[y][c].tile = null; } }
        seg.forEach((y, i) => {
          if (i < tiles.length) { const t = tiles[i]; G.grid[y][c].tile = t; if (t.y !== y || t.x !== c) mv.push({ t, r: y, c }); }
          else if (r === -1) { const t = newTile(randKind(), y, c); t.y = spawnY--; G.grid[y][c].tile = t; pickRefillKind(y, c, t); mv.push({ t, r: y, c }); }
        });
        seg = [];
      } else if (!cell.hole) seg.push(r);
    }
  }
  return mv;
}
// Refills avoid landing in a match, so one move can't chain forever. A small, shrinking
// chance of a "lucky" refill keeps the occasional free cascade.
function pickRefillKind(r, c, t) {
  if (Math.random() < .12 / (1 + G.chain)) return;
  const kinds = [...Array(G.def.k).keys()].sort(() => Math.random() - .5);
  for (const k of kinds) { t.k = k; if (!matchAt(r, c)) return; }
}
function diagonal() {
  const mv = [], used = new Set();
  for (let r = G.rows - 1; r >= 1; r--) for (let c = 0; c < G.cols; c++) {
    const cell = G.grid[r][c]; if (cell.hole || cell.b || cell.tile) continue;
    let ra = r - 1; while (ra >= 0 && G.grid[ra][c].hole) ra--;
    if (ra < 0 || !G.grid[ra][c].b) continue;
    for (const dc of Math.random() < .5 ? [-1, 1] : [1, -1]) {
      const cc = c + dc; if (cc < 0 || cc >= G.cols) continue;
      const src = G.grid[r - 1][cc], key = (r - 1) * G.cols + cc;
      if (src.hole || src.b || !src.tile || used.has(key)) continue;
      const below = G.grid[r][cc]; if (!below.hole && !below.b && !below.tile) continue;
      used.add(key); cell.tile = src.tile; src.tile = null; mv.push({ t: cell.tile, r, c }); break;
    }
  }

}
function animateFall(mv) {
  return Promise.all(mv.map(({ t, r, c }) => { const d = Math.hypot(r - t.y, c - t.x); return tween(t, { x: c, y: r }, 80 + 75 * Math.sqrt(d), easeIn); }));
}
async function settle() {
  for (let guard = 0; guard < 60; guard++) {
    const mv = gravity(); if (mv.length) await animateFall(mv);
    const dm = diagonal(); if (dm.length) { await animateFall(dm); continue; }
    break;
  }
}

/* ---------- end of turn ---------- */
const goalsDone = () => G.goals.every(g => g.left <= 0);
async function endTurn() {
  updateHud();
  if (goalsDone()) { await winFlow(); return; }
  if (G.moves <= 0) { await delay(400); G.over = true; G.busy = false; sfx.lose(); showLose(); return; }
  if (!findMove()) await shuffleBoard();
  G.busy = false; scheduleHint();
}
async function shuffleBoard() {
  banner('Shuffle!'); await delay(400);
  const cells = [];
  for (let r = 0; r < G.rows; r++) for (let c = 0; c < G.cols; c++) { const t = G.grid[r][c].tile; if (t && !t.sp && !G.grid[r][c].b) cells.push(t); }
  await Promise.all(cells.map(t => tween(t, { s: .2 }, 200, easeIn)));
  const kinds = cells.map(t => t.k);
  let ok = false;
  for (let tries = 0; tries < 300 && !ok; tries++) {
    for (let i = kinds.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [kinds[i], kinds[j]] = [kinds[j], kinds[i]]; }
    cells.forEach((t, i) => t.k = kinds[i]);
    ok = !findMatches().length && !!findMove();
  }
  if (!ok && cells.length) { const t = cells[Math.floor(Math.random() * cells.length)]; t.sp = 'tnt'; t.k = -1; }
  await Promise.all(cells.map(t => tween(t, { s: 1 }, 260, easeBack)));

}

  G.over = true;
  const left = G.moves, m = G.def.m;
  const stars = left >= Math.ceil(m * .28) ? 3 : left >= Math.ceil(m * .1) ? 2 : 1;
  await delay(250); sfx.win(); banner('Level Complete!'); await delay(1100);
  if (left > 0) {
    banner("King's Bonus!"); await delay(500);
    const n = Math.min(left, 12);
    for (let i = 0; i < n; i++) {
      const pool = [];
      for (let r = 0; r < G.rows; r++) for (let c = 0; c < G.cols; c++) { const t = G.grid[r][c].tile; if (t && !t.sp) pool.push(t); }
      if (!pool.length) break;
      const t = pool[Math.floor(Math.random() * pool.length)];
      t.sp = Math.random() < .5 ? 'rh' : 'rv'; t.k = -1; t.s = .3; tween(t, { s: 1 }, 220, easeBack);
      G.moves--; updateHud(); sfx.special(); await delay(110);
    }
    G.moves = 0; updateHud();
    for (let guard = 0; guard < 25; guard++) {
      const sps = [];
      for (let r = 0; r < G.rows; r++) for (let c = 0; c < G.cols; c++) { const t = G.grid[r][c].tile; if (t && t.sp) sps.push([r, c, t]); }
      if (!sps.length) break;
      for (const [r, c, t] of sps) { if (G.grid[r][c].tile !== t) continue; G.grid[r][c].tile = null; track(fire(r, c, t)); await delay(120); }
      await flush(); await cascade();
    }
  }
  const coins = 15 + left * 4;

  S.stars[G.n] = Math.max(S.stars[G.n] || 0, stars);
  if (G.n >= S.unlocked) S.unlocked = Math.min(LEVEL_COUNT, G.n + 1);
  S.coins += coins; save();
  G.busy = false;
  showWin(stars, coins, firstClear);
}

/* ---------- boosters ---------- */

];

  SCENES[viewArea](g, item);
