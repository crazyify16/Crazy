<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crown Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: one-screen phone app. Map (scrolling level path) / Game (goals bar, board, boosters) / Castle (scene + tasks). Single dark royal look. */
:root {
  color-scheme: dark;
  --night: #141932;
  --night-2: #222a55;
  --stone: #39407a;
  --gold: #ffc53d;
  --gold-deep: #b9720b;
  --cream: #fff4d9;
  --ruby: #e8343f;
  --leaf: #3cb84a;
  --sky: #2d7fe6;
  --ink: #1b1532;
  --muted: #aab1e0;
  --display: 'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
  --body: 'Nunito', 'Segoe UI', system-ui, sans-serif;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: radial-gradient(120% 70% at 50% 0%, var(--night-2), var(--night) 70%);
  background-color: var(--night);
  color: var(--cream);
  font-family: var(--body);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
#app { height: 100%; max-width: 560px; margin: 0 auto; position: relative; }
.screen { height: 100%; display: flex; flex-direction: column; padding: 10px 16px; box-sizing: border-box; gap: 10px; }

/* shared chunky button */
.btn {
  font-family: var(--display); font-size: 20px; letter-spacing: .02em;
  padding: 10px 18px; border-radius: 14px;
  background: linear-gradient(#ffd96a, var(--gold) 55%, #f0a01c);
  color: var(--ink);
  box-shadow: 0 4px 0 var(--gold-deep), 0 8px 18px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.6);
  text-shadow: 0 1px 0 rgba(255,255,255,.5);
  transition: transform .08s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-deep), inset 0 2px 0 rgba(255,255,255,.6); }
.btn.green { background: linear-gradient(#8ff07c, var(--leaf) 60%, #23902f); box-shadow: 0 4px 0 #17621f, 0 8px 18px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.5); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
.btn.blue { background: linear-gradient(#7fb8ff, var(--sky) 60%, #1b55b0); box-shadow: 0 4px 0 #123f85, 0 8px 18px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.45); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
body .btn.btn.danger { background: linear-gradient(#ff6b7a, #c8102a); box-shadow: 0 4px 0 #6a0614, inset 0 2px 0 rgba(255,255,255,.35); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.25); } /* destructive: always red */
.btn.ghost { background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 2px rgba(255,255,255,.18); color: var(--cream); text-shadow: none; }
.btn[disabled] { filter: grayscale(.8) brightness(.7); cursor: not-allowed; }

/* ---------- map ---------- */
.hud { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.brand .logo { width: 26px; height: 26px; margin: -5px 2px 0 0; flex: none; }
.brand { display: flex; align-items: center; min-width: 0; font-family: var(--display); font-size: clamp(17px, 5.4vw, 24px); white-space: nowrap; color: var(--gold); -webkit-text-stroke: 1px #5a2b00; paint-order: stroke fill; text-shadow: 0 3px 0 var(--gold-deep), 0 6px 14px rgba(0,0,0,.4); letter-spacing: .02em; }
.pill {
  display: flex; align-items: center; gap: 5px; min-width: 0; flex: none; justify-content: center;
  font-family: var(--display); font-size: 17px; padding: 5px 10px; border-radius: 999px;
  background: rgba(0,0,0,.35); box-shadow: inset 0 0 0 2px rgba(255,255,255,.12);
  font-variant-numeric: tabular-nums;
}
.pill .ico { width: 20px; height: 20px; display: inline-block; }
#mapScroll { flex: 1; overflow-y: auto; overflow-x: hidden; border-radius: 22px; position: relative; outline: 3px solid #f4c74f; outline-offset: -3px;
  background:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,.05) 0 2px, transparent 3px) 0 0/48px 48px,
    linear-gradient(#2a6c3f, #1f5332);
  box-shadow: inset 0 0 0 4px rgba(0,0,0,.25), inset 0 0 40px rgba(0,0,0,.45);
  scrollbar-width: none; }
#mapScroll::-webkit-scrollbar { display: none; }
#mapInner { position: relative; }
#mapDecor { position: absolute; left: 0; top: 0; pointer-events: none; }
#mapPath { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.node {
  background-blend-mode: normal;
  position: absolute; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
  font-family: var(--display); font-size: 22px; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.35);
  background: radial-gradient(ellipse 60% 34% at 45% 22%, rgba(255,255,255,.65), rgba(255,255,255,0) 100%), radial-gradient(circle at 35% 30%, #7fc0ff, #1f5fc0 70%);
  box-shadow: 0 0 0 3px #0a1f55, 0 6px 0 #0a1f55, 0 10px 16px rgba(0,0,0,.45), inset 0 -5px 0 rgba(0,0,0,.18);
  -webkit-text-stroke: 3px #0a1f55; paint-order: stroke fill;
}
.node.done { background: radial-gradient(ellipse 60% 34% at 45% 22%, rgba(255,255,255,.7), rgba(255,255,255,0) 100%), radial-gradient(circle at 35% 30%, #fff09a, #e79a12 70%); box-shadow: 0 0 0 3px #5a2b00, 0 6px 0 #5a2b00, 0 10px 16px rgba(0,0,0,.45), inset 0 -5px 0 rgba(0,0,0,.15); color: #fff; -webkit-text-stroke: 3px #5a2b00; }
.node.locked { background: radial-gradient(ellipse 60% 34% at 45% 22%, rgba(255,255,255,.3), rgba(255,255,255,0) 100%), radial-gradient(circle at 35% 30%, #a3a8c0, #555a73 70%); box-shadow: 0 0 0 3px #262a3a, 0 6px 0 #262a3a, 0 8px 12px rgba(0,0,0,.35); color: #c9cde0; -webkit-text-stroke: 3px #262a3a; cursor: default; }
.devnote { font-size: 13px; opacity: .8; margin: 4px 0 8px; }
.devjump input { width: 84px; font: inherit; font-size: 18px; text-align: center; border-radius: 12px; border: 2px solid rgba(255,255,255,.35); background: rgba(0,0,0,.25); color: #fff; padding: 8px; }
.node.locked.dev { cursor: pointer; opacity: .8; outline: 2px dashed rgba(255,255,255,.55); outline-offset: 3px; }
.node.current { animation: bob 1.2s ease-in-out infinite; z-index: 2; }
.node.current::after { content: ''; position: absolute; inset: -9px; border-radius: 50%; border: 3px solid var(--gold); opacity: .8; }
.node.hard:not(.locked):not(.done) { background: radial-gradient(ellipse 60% 34% at 45% 22%, rgba(255,255,255,.65), rgba(255,255,255,0) 100%), radial-gradient(circle at 35% 30%, #ff8a93, #b3121f 70%); box-shadow: 0 0 0 3px #4a0410, 0 6px 0 #4a0410, 0 10px 16px rgba(0,0,0,.45), inset 0 -5px 0 rgba(0,0,0,.18); -webkit-text-stroke: 3px #4a0410; }
.node.hard::before { content: 'HARD'; position: absolute; left: 50%; bottom: -24px; transform: translateX(-50%); font-family: var(--body); font-weight: 900; font-size: 10px; letter-spacing: .08em; padding: 1px 6px; border-radius: 6px; background: var(--ruby); color: #fff; text-shadow: none; box-shadow: 0 2px 0 #6a0a15; }
.hard-tag { display: inline-block; font-weight: 900; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: 8px; background: var(--ruby); color: #fff; box-shadow: 0 2px 0 #6a0a15; }
.bubble small.hard { color: var(--ruby); }
.node.rescue:not(.locked):not(.done) { background: radial-gradient(ellipse 60% 34% at 45% 22%, rgba(255,255,255,.6), rgba(255,255,255,0) 100%), radial-gradient(circle at 35% 30%, #7af0d8, #128a78 70%);
  box-shadow: 0 0 0 3px #064a40, 0 6px 0 #064a40, 0 10px 16px rgba(0,0,0,.45), inset 0 -5px 0 rgba(0,0,0,.18); -webkit-text-stroke: 3px #064a40; }
.node.rescue::before { content: 'RESCUE'; position: absolute; left: 50%; bottom: -24px; transform: translateX(-50%); font-family: var(--body); font-weight: 900; font-size: 10px; letter-spacing: .08em; padding: 1px 6px; border-radius: 6px; background: #128a78; color: #fff; text-shadow: none; box-shadow: 0 2px 0 #064a40; -webkit-text-stroke: 0; }
.rescue-tag { background: #128a78 !important; box-shadow: 0 2px 0 #064a40 !important; }
.node .stars { position: absolute; left: 50%; top: -16px; transform: translateX(-50%); display: flex; gap: 1px; }
.node .stars i { width: 15px; height: 15px; display: block; clip-path: polygon(50% 0, 62% 35%, 100% 38%, 70% 60%, 80% 98%, 50% 76%, 20% 98%, 30% 60%, 0 38%, 38% 35%); background: rgba(0,0,0,.35); }
.node .stars i.on { background: var(--gold); }
@keyframes bob { 50% { transform: translateY(-6px); } }
.mapbar { display: flex; gap: 10px; align-items: stretch; }
.mapbar .btn { flex: 1; font-size: 18px; padding: 10px 8px; }
.mapbar #playBtn { flex: 1.6; font-size: 24px; }

/* ---------- game ---------- */
#game { gap: 8px; }
.gtop { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: stretch; }
.panel { background: linear-gradient(#4b57b8, #2b3277 60%, #232864); border-radius: 16px;
  box-shadow: inset 0 0 0 2px #f4c74f, inset 0 0 0 4px #7a4a10, inset 0 6px 0 4px rgba(255,255,255,.1), 0 4px 0 #11143a, 0 8px 18px rgba(0,0,0,.4); }
.back { width: 44px; font-family: var(--display); font-size: 26px; }
.goals { display: flex; justify-content: center; align-items: center; gap: 12px; padding: 6px 10px; min-width: 0; flex-wrap: wrap; }
.goal { position: relative; display: flex; flex-direction: column; align-items: center; }
.goal canvas { width: 38px; height: 38px; display: block; }
.goal b { font-family: var(--display); font-weight: 400; font-size: 19px; line-height: 1; margin-top: -4px; -webkit-text-stroke: 3px #1a1440; paint-order: stroke fill; font-variant-numeric: tabular-nums; }
.goal.bump canvas { animation: bump .25s; }
.goal.met b { color: var(--leaf); }
@keyframes bump { 50% { transform: scale(1.25); } }
.moves { width: 74px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px; }
.moves small { font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.moves b { font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1; color: #fff; -webkit-text-stroke: 4px #1a1440; paint-order: stroke fill; font-variant-numeric: tabular-nums; }
.moves small { color: var(--gold) !important; }
.moves.low b { color: #ff7a7a; animation: bump .6s infinite; }
.moves b.tick { animation: tick .35s cubic-bezier(.2,1.8,.4,1); }
@keyframes tick { 0% { transform: scale(1.45) rotate(-8deg); } 100% { transform: none; } }
#peril { width: 100%; height: clamp(92px, 16vh, 132px); display: block; border-radius: 16px; box-sizing: border-box; border: 3px solid var(--gold); background: #05030a; box-shadow: 0 4px 0 rgba(0,0,0,.35); }
.moves { min-width: 74px; width: auto !important; }
.kingrow { display: flex; align-items: center; gap: 12px; }
#king { width: 72px; height: 72px; flex: none; }
.bubble { position: relative; flex: 1; min-width: 0; background: var(--cream); color: var(--ink); border-radius: 14px; padding: 6px 12px 7px; box-shadow: 0 3px 0 rgba(0,0,0,.3); font-weight: 800; font-size: 14px; line-height: 1.25; }
.bubble::before { content: ''; position: absolute; left: -8px; top: 50%; margin-top: -8px; border: 8px solid transparent; border-left: 0; border-right-color: var(--cream); }
.bubble small { display: block; font-family: var(--display); font-weight: 400; font-size: 13px; color: var(--gold-deep); letter-spacing: .04em; }
.bubble.pop { animation: nudge .3s; }
@keyframes nudge { 50% { transform: scale(1.04); } }
@media (max-height: 640px) { #king { width: 52px; height: 52px; } .bubble { font-size: 12px; } }
#boardWrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
#board { touch-action: none; display: block; }
.boosters { display: flex; justify-content: center; gap: 10px; padding-bottom: 4px; }
.boost { position: relative; width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; }
.boost canvas { width: 40px; height: 40px; }
.boost .n { position: absolute; right: -4px; bottom: -4px; min-width: 22px; height: 22px; border-radius: 11px; background: linear-gradient(#ff6b7a, var(--ruby)); font-family: var(--display); font-size: 14px; display: grid; place-items: center; box-shadow: 0 0 0 2px #fff, 0 3px 0 rgba(0,0,0,.35); }
.boost.on { box-shadow: inset 0 0 0 3px var(--gold), 0 0 18px rgba(255,197,61,.6); }
.boost.empty { opacity: .45; }
.hint-line { text-align: center; font-weight: 800; font-size: 14px; color: var(--gold); min-height: 18px; }

/* ---------- castle ---------- */
.castle-head { display: flex; align-items: center; gap: 10px; }
.castle-head h2 { margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--display); font-weight: 400; font-size: clamp(18px, 6.2vw, 26px); color: var(--gold); text-shadow: 0 3px 0 var(--gold-deep); }
#scene3d { width: 100%; aspect-ratio: 4/3; border-radius: 18px; display: block; touch-action: none; cursor: grab; box-shadow: 0 6px 0 #0d1028, 0 0 0 4px rgba(255,255,255,.1); }
#scene[hidden], #scene3d[hidden] { display: none; }
.scene-wrap { position: relative; }
.scene-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 42px; height: 42px; border-radius: 50%; padding: 0; font-size: 26px; line-height: 1; color: #fff; display: grid; place-items: center; z-index: 2; }
.scene-nav.prev { left: 8px; } .scene-nav.next { right: 8px; }
.scene-nav:disabled { opacity: .3; }
.scene-nav[hidden], .kingdom-btn[hidden] { display: none; }
.kingdom-btn { position: absolute; top: 8px; right: 8px; padding: 7px 12px; font-size: 14px; font-weight: 800; color: #fff; z-index: 2; border-radius: 12px; }
.area-dots { position: absolute; left: 0; right: 0; bottom: 8px; display: flex; justify-content: center; gap: 6px; pointer-events: none; z-index: 2; }
.area-dots i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.35); box-shadow: 0 1px 2px rgba(0,0,0,.5); }
.area-dots i.on { background: var(--gold); width: 20px; border-radius: 4px; }
.area-dots i.locked { background: rgba(0,0,0,.4); }
.realm { cursor: pointer; flex-direction: column; align-items: stretch !important; gap: 6px; }
.realm .rh { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.realm .rh b { font-family: var(--display); font-weight: 400; color: var(--gold); font-size: 18px; }
.realm .rbar { height: 6px; border-radius: 3px; background: rgba(0,0,0,.35); overflow: hidden; } .realm .rbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), #ffe9a0); }
.realm .ups { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; opacity: .9; }
.realm .ups .up { white-space: nowrap; flex: none; }
.realm .ups .up.y { color: #8eea7a; } .realm .ups .up.n { opacity: .55; }
.realm.locked { opacity: .55; cursor: default; }
#scene { width: 100%; aspect-ratio: 16/10; max-width: 100%; border-radius: 18px; display: block; box-shadow: 0 6px 0 #0d1028, 0 0 0 4px rgba(255,255,255,.1); }
.prog { height: 14px; border-radius: 7px; background: rgba(0,0,0,.4); overflow: hidden; }
.prog i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), #ffe48a); border-radius: 7px; transition: width .4s; }
.tasks { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.task { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,.07); }
.task span { flex: 1; font-weight: 800; min-width: 0; }
.task.done span { color: var(--muted); text-decoration: line-through; }
.task .btn { font-size: 16px; padding: 7px 12px; }
.task .tick { font-family: var(--display); color: var(--leaf); font-size: 20px; }

/* ---------- modal / banner / fx ---------- */
#modal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(8,10,28,.6); padding: 16px; }
#modal .card {
  width: min(360px, 100%); box-sizing: border-box; padding: 22px 20px 20px; border-radius: 24px; text-align: center;
  background: linear-gradient(#4a54a8, #2b3170); box-shadow: inset 0 0 0 4px rgba(255,255,255,.14), 0 8px 0 #141836, 0 20px 50px rgba(0,0,0,.5);
  animation: pop .28s cubic-bezier(.2,1.6,.4,1);
  display: flex; flex-direction: column; gap: 14px; align-items: center;
}
#modal h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 32px; color: var(--gold); text-shadow: 0 3px 0 var(--gold-deep); }
#modal p { margin: 0; font-weight: 800; color: var(--muted); max-width: 30ch; }
#modal .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; width: 100%; }
#modal .row .btn { flex: 1; min-width: 120px; }
.goalrow { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.bigstars { display: flex; gap: 6px; align-items: flex-end; }
.bigstars i { width: 56px; height: 56px; display: block; clip-path: polygon(50% 0, 62% 35%, 100% 38%, 70% 60%, 80% 98%, 50% 76%, 20% 98%, 30% 60%, 0 38%, 38% 35%); background: rgba(0,0,0,.35); }
.bigstars i:nth-child(2) { width: 70px; height: 70px; }
.bigstars i.on { background: linear-gradient(#fff3a6, var(--gold) 50%, #f08c00); animation: pop .4s backwards; }
.bigstars i.on:nth-child(2) { animation-delay: .25s; }
.bigstars i.on:nth-child(3) { animation-delay: .5s; }
@keyframes pop { from { transform: scale(.3); opacity: 0; } }
#banner { position: fixed; left: 0; right: 0; top: 42%; z-index: 15; text-align: center; pointer-events: none;
  font-family: var(--display); font-size: 44px; color: var(--gold);
  text-shadow: 0 4px 0 var(--gold-deep), 0 0 30px rgba(0,0,0,.6); opacity: 0; }
#banner.show { animation: banner 1.15s ease-out forwards; }
#banner { -webkit-text-stroke: 2px #5a2a00; paint-order: stroke fill; }
@keyframes banner { 0% { opacity: 0; transform: scale(.2) rotate(-12deg); } 18% { opacity: 1; transform: scale(1.25) rotate(4deg); } 28% { transform: scale(.95) rotate(-2deg); } 36% { transform: scale(1.03) rotate(0); } 80% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: translateY(-40px) scale(.9); } }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 12; width: 100%; height: 100%; }
/* ---------- Halloween theme ---------- */
body.halloween { --gold: #ff9a2e; --gold-deep: #7a2600; --leaf: #8be04a; --muted: #c9b2e6; }
body.halloween .btn { background: linear-gradient(#ffc46b, #ff8a1f 55%, #e05a00); box-shadow: 0 4px 0 #7a2600, 0 8px 18px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.5); }
body.halloween .btn.green { background: linear-gradient(#b8ff7a, #5fcf2a 60%, #2f8a12); box-shadow: 0 4px 0 #1f5a0a, 0 8px 18px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.45); }
body.halloween .btn.blue { background: linear-gradient(#c58aff, #8a35d6 60%, #4f128f); box-shadow: 0 4px 0 #2e0a5a, 0 8px 18px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.4); }
body.halloween .btn.ghost { background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 2px rgba(255,255,255,.18); }
body.halloween .panel { background: linear-gradient(#4a2a6e, #2a1546 60%, #1f0f36);
  box-shadow: inset 0 0 0 2px #ff9a2e, inset 0 0 0 4px #4a1600, inset 0 6px 0 4px rgba(255,255,255,.08), 0 4px 0 #0c0518, 0 8px 18px rgba(0,0,0,.5); }
body.halloween #modal .card { background: linear-gradient(#4f2c78, #241238); }
body.halloween #mapScroll { outline-color: #ff9a2e; }
body.halloween .node { background: radial-gradient(ellipse 60% 34% at 45% 22%, rgba(255,255,255,.6), rgba(255,255,255,0) 100%), radial-gradient(circle at 35% 30%, #c58aff, #5a1aa0 70%);
  box-shadow: 0 0 0 3px #2e0a5a, 0 6px 0 #2e0a5a, 0 10px 16px rgba(0,0,0,.5), inset 0 -5px 0 rgba(0,0,0,.18); -webkit-text-stroke: 3px #2e0a5a; }
body.halloween .node.done { background: radial-gradient(ellipse 60% 34% at 45% 22%, rgba(255,255,255,.7), rgba(255,255,255,0) 100%), radial-gradient(circle at 35% 30%, #ffc46b, #e05a00 70%);
  box-shadow: 0 0 0 3px #5a1d00, 0 6px 0 #5a1d00, 0 10px 16px rgba(0,0,0,.5), inset 0 -5px 0 rgba(0,0,0,.15); -webkit-text-stroke: 3px #5a1d00; }
body.halloween .node.locked { background: radial-gradient(ellipse 60% 34% at 45% 22%, rgba(255,255,255,.3), rgba(255,255,255,0) 100%), radial-gradient(circle at 35% 30%, #8a8399, #45404f 70%);
  box-shadow: 0 0 0 3px #1c1626, 0 6px 0 #1c1626, 0 8px 12px rgba(0,0,0,.4); color: #c9c2d6; -webkit-text-stroke: 3px #1c1626; }
body.halloween .node.hard:not(.locked):not(.done) { background: radial-gradient(ellipse 60% 34% at 45% 22%, rgba(255,255,255,.6), rgba(255,255,255,0) 100%), radial-gradient(circle at 35% 30%, #ff8a93, #b3121f 70%);
